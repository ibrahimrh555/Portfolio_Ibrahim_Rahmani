name: Migrate Neon database

on:
  push:
    branches:
      - main
    paths:
      - "backend/content/migrations/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Django migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DEBUG: "False"
      ALLOWED_HOSTS: localhost
      DJANGO_SUPERUSER_USERNAME: ${{ secrets.DJANGO_SUPERUSER_USERNAME }}
      DJANGO_SUPERUSER_EMAIL: ${{ secrets.DJANGO_SUPERUSER_EMAIL }}
      DJANGO_SUPERUSER_PASSWORD: ${{ secrets.DJANGO_SUPERUSER_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL" || (echo "NEON_DATABASE_URL is missing" && exit 1)
          test -n "$SECRET_KEY" || (echo "DJANGO_SECRET_KEY is missing" && exit 1)
      - name: Apply migrations
        run: python manage.py migrate --noinput
      - name: Create administrator when configured
        if: ${{ env.DJANGO_SUPERUSER_USERNAME != '' && env.DJANGO_SUPERUSER_PASSWORD != '' }}
        run: python manage.py createsuperuser --noinput || echo "Administrator already exists"
