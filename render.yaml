services:
  - type: web
    name: portfolio-ibrahim-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn portfolio_api.wsgi:application
    healthCheckPath: /api/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: portfolio-ibrahim-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ibrahimrh555.github.io
      - key: CSRF_TRUSTED_ORIGINS
        value: https://portfolio-ibrahim-api.onrender.com
      - key: DATABASE_URL
        sync: false
